<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三维技术坐标系 · 3D Coordinate System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; color: #f5f5f5;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #scene { position: fixed; inset: 0; z-index: 0; }
  #labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

  #pbar {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: min(760px, 92vw); height: auto; z-index: 10;
  }

  .alabel { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; white-space: nowrap; user-select: none; color: #fff; }
  .tick { font-size: 10px; font-weight: 300; color: #8a8a8a; user-select: none; }

  .tooltip { position: fixed; pointer-events: none; z-index: 30; max-width: 400px;
    background: #f5f5f5; color: #000; padding: 12px 14px; border-radius: 6px; opacity: 0;
    transition: opacity 0.15s ease; box-shadow: 0 8px 40px rgba(0,0,0,0.55); }
  .tooltip .t-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .tooltip .t-sec { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; opacity: 0.55; margin-bottom: 6px; }
  .tooltip .t-desc { font-size: 11.5px; line-height: 1.5; opacity: 0.85; }
  .tooltip .t-courses { font-size: 10px; font-weight: 300; line-height: 1.5; margin-top: 7px; opacity: 0.55; }
  .tooltip .t-link { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; margin-top: 8px; opacity: 0.6; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <svg id="pbar" viewBox="0 0 760 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="各领域比例"></svg>
  <div class="tooltip" id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script src="./data.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const DATA = window.COO_DATA || { axes: [], sections: [], nodes: [] };
const S = 5.04;                   // unit cube [0,1]^3 -> [0,S]^3
const NODE_R = 0.09;

const AXIS_C = new THREE.Color('#ffffff');
const SEC_MAP = Object.fromEntries(DATA.sections.map(s => [s.tag, s.color]));
const secColor = t => SEC_MAP[t] || '#999999';

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#000000');

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 300);
camera.position.set(12, 8.5, 13.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(S / 2, S / 2, S / 2);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.enablePan = true;
controls.minDistance = 6;
controls.maxDistance = 40;
controls.minPolarAngle = 0.1;
controls.maxPolarAngle = 1.45;

/* ---------- labels renderer ---------- */
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
document.getElementById('labels').appendChild(labelRenderer.domElement);

function addLabel(html, pos, cls) {
  const el = document.createElement('div');
  el.className = cls || '';
  el.innerHTML = html;
  const o = new CSS2DObject(el);
  o.position.copy(pos);
  scene.add(o);
  return o;
}

/* ---------- coordinate frame ---------- */
function makeAxis(key, dir, len) {
  const a = new THREE.Vector3(0, 0, 0);
  const b = dir.clone().multiplyScalar(len);
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  scene.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: AXIS_C, transparent: true, opacity: 0.9 })));

  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.34, 20), new THREE.MeshBasicMaterial({ color: AXIS_C }));
  cone.position.copy(b);
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  scene.add(cone);

  const axisInfo = DATA.axes.find(x => x.key === key) || { label: key, en: '' };
  addLabel(`${axisInfo.en}`, b.clone().add(dir.clone().multiplyScalar(0.55)), 'alabel').element.style.color = '#' + AXIS_C.getHexString();

  for (const v of [0, 0.5, 1]) {
    const p = dir.clone().multiplyScalar(v * len);
    const off = new THREE.Vector3();
    const perp = [0, 1, 2].filter(k => k !== ['X', 'Y', 'Z'].indexOf(key));
    off.setComponent(perp[0], -0.22);
    off.setComponent(perp[1], -0.22);
    addLabel(String(v), p.clone().add(off), 'tick');
  }
}

const edgeMat = new THREE.LineBasicMaterial({ color: '#2a2a2a', transparent: true, opacity: 0.6 });
for (let i = 0; i < 3; i++) {
  for (const f1 of [0, 1]) for (const f2 of [0, 1]) {
    const p0 = new THREE.Vector3(), p1 = new THREE.Vector3();
    const fixed = [f1, f2]; let fi = 0;
    for (let k = 0; k < 3; k++) {
      if (k === i) { p0.setComponent(k, 0); p1.setComponent(k, S); }
      else { p0.setComponent(k, fixed[fi] * S); p1.setComponent(k, fixed[fi] * S); fi++; }
    }
    const g = new THREE.BufferGeometry().setFromPoints([p0, p1]);
    scene.add(new THREE.Line(g, edgeMat));
  }
}

makeAxis('X', new THREE.Vector3(1, 0, 0), S);
makeAxis('Y', new THREE.Vector3(0, 1, 0), S);
makeAxis('Z', new THREE.Vector3(0, 0, 1), S);

/* ---------- nodes (instanced spheres) ---------- */
const nodes = DATA.nodes;
const nGeo = new THREE.SphereGeometry(NODE_R, 20, 20);
const nMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0.1 });
const nMesh = new THREE.InstancedMesh(nGeo, nMat, nodes.length);
nMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const m4 = new THREE.Matrix4();
const baseColor = [];
nodes.forEach((n, i) => {
  m4.makeScale(1, 1, 1);
  m4.setPosition(n.x * S, n.y * S, n.z * S);
  nMesh.setMatrixAt(i, m4);
  const c = new THREE.Color(secColor(n.section));
  baseColor.push(c.clone());
  nMesh.setColorAt(i, c);
});
nMesh.instanceMatrix.needsUpdate = true;
if (nMesh.instanceColor) nMesh.instanceColor.needsUpdate = true;
scene.add(nMesh);

/* ---------- 同学科连线（每领域一棵最小生成树） ---------- */
function buildEdges(list) {
  const bySec = {};
  list.forEach((n, i) => { (bySec[n.section] = bySec[n.section] || []).push(i); });
  const edges = [];
  for (const sec in bySec) {
    const ids = bySec[sec];
    const n = ids.length;
    if (n < 2) continue;
    const seen = new Array(n).fill(false);
    const best = new Float64Array(n).fill(Infinity);
    const parent = new Int32Array(n).fill(-1);
    best[0] = 0;
    for (let step = 0; step < n; step++) {
      let u = -1, min = Infinity;
      for (let k = 0; k < n; k++) if (!seen[k] && best[k] < min) { min = best[k]; u = k; }
      if (u < 0) break;
      seen[u] = true;
      if (parent[u] >= 0) edges.push([ids[parent[u]], ids[u]]);
      const pu = list[ids[u]];
      for (let v = 0; v < n; v++) {
        if (seen[v]) continue;
        const pv = list[ids[v]];
        const d2 = (pu.x - pv.x) ** 2 + (pu.y - pv.y) ** 2 + (pu.z - pv.z) ** 2;
        if (d2 < best[v]) { best[v] = d2; parent[v] = u; }
      }
    }
  }
  return edges;
}

const edges = buildEdges(nodes);
const ePos = new Float32Array(edges.length * 6);
const eCol = new Float32Array(edges.length * 6);
edges.forEach(([a, b], i) => {
  const pa = nodes[a], pb = nodes[b];
  ePos.set([pa.x * S, pa.y * S, pa.z * S, pb.x * S, pb.y * S, pb.z * S], i * 6);
  const c = new THREE.Color(secColor(nodes[a].section));
  eCol.set([c.r, c.g, c.b, c.r, c.g, c.b], i * 6);
});
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
edgeGeo.setAttribute('color', new THREE.BufferAttribute(eCol, 3));
const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.45 }));
scene.add(edgeLines);

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(15, 25, 18); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-20, 8, -10); scene.add(fill);

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.5, 0.55);
composer.addPass(bloom);

/* ---------- SVG 比例条 ---------- */
(function buildSvgBar() {
  const svg = document.getElementById('pbar');
  const total = nodes.length;
  const counts = DATA.sections.map(s => ({ ...s, cnt: nodes.filter(n => n.section === s.tag).length }));
  counts.forEach(s => { s.pct = total ? (s.cnt / total) * 100 : 0; });

  const WB = 760, barY = 4, barH = 18, lgY = 37;
  let parts = `<defs><clipPath id="barclip"><rect x="0" y="${barY}" width="${WB}" height="${barH}" rx="5"/></clipPath></defs>`;
  parts += `<g clip-path="url(#barclip)">`;
  let x = 0;
  for (const s of counts) {
    const w = (s.cnt / total) * WB;
    parts += `<rect x="${x.toFixed(2)}" y="${barY}" width="${(w + 0.6).toFixed(2)}" height="${barH}" fill="${s.color}"><title>${s.tag} · ${s.label} · ${s.pct.toFixed(1)}%</title></rect>`;
    x += w;
  }
  parts += `</g>`;
  const slot = WB / counts.length;
  counts.forEach((s, i) => {
    const sx = i * slot + 6;
    parts += `<rect x="${sx.toFixed(1)}" y="${lgY - 7}" width="8" height="8" rx="2" fill="${s.color}"/>`;
    parts += `<text x="${(sx + 12).toFixed(1)}" y="${lgY}" font-size="9" fill="#9a9a9a">${s.tag}</text>`;
    parts += `<text x="${((i + 1) * slot - 6).toFixed(1)}" y="${lgY}" font-size="9" fill="#e8e8e8" text-anchor="end">${s.pct.toFixed(1)}%</text>`;
  });
  svg.innerHTML = parts;
})();

/* ---------- hover / click ---------- */
const tooltip = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = -1;

function setNode(i, scale, color) {
  m4.makeScale(scale, scale, scale);
  m4.setPosition(nodes[i].x * S, nodes[i].y * S, nodes[i].z * S);
  nMesh.setMatrixAt(i, m4);
  nMesh.setColorAt(i, color);
  nMesh.instanceMatrix.needsUpdate = true;
  if (nMesh.instanceColor) nMesh.instanceColor.needsUpdate = true;
}
function pick(x, y) {
  pointer.x = (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(nMesh, false);
  return hit.length ? hit[0].instanceId : -1;
}
canvas.addEventListener('pointermove', e => {
  const i = pick(e.clientX, e.clientY);
  if (i !== hovered) {
    if (hovered >= 0) setNode(hovered, 1, baseColor[hovered]);
    hovered = i;
    if (i >= 0) {
      const n = nodes[i];
      const sec = DATA.sections.find(s => s.tag === n.section);
      setNode(i, 1.9, new THREE.Color('#ffffff'));
      tooltip.innerHTML =
        `<div class="t-name">${n.name}</div>` +
        `<div class="t-sec">${n.section} · ${sec ? sec.label : ''} · (${n.x.toFixed(2)}, ${n.y.toFixed(2)}, ${n.z.toFixed(2)})</div>` +
        `<div class="t-desc">${n.desc}</div>` +
        (n.courses ? `<div class="t-courses">${n.courses}</div>` : '') +
        `<div class="t-link">点击打开 GitHub ↗</div>`;
      tooltip.style.left = Math.min(e.clientX + 16, innerWidth - 420) + 'px';
      tooltip.style.top = Math.min(e.clientY + 16, innerHeight - 120) + 'px';
      tooltip.style.opacity = '1';
      canvas.style.cursor = 'pointer';
    } else {
      tooltip.style.opacity = '0';
      canvas.style.cursor = 'grab';
    }
  }
});

let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('click', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  down = null;
  if (moved > 5) return;
  const i = pick(e.clientX, e.clientY);
  if (i >= 0 && nodes[i].link) window.open(nodes[i].link, '_blank');
});

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------- animate ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
